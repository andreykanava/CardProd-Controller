services:
  controller:
    build: .
    container_name: wg-controller
    environment:
      - DATA_DIR=/data
      - WG_IFACE=wg0
      - WG_ADDR=10.50.0.1/24
      - WG_LISTEN_PORT=51820
      - WG_NET=10.50.0.0/24
      - CONTROLLER_IP=10.50.0.1
      - WG_ENDPOINT=${WG_ENDPOINT}          # "PUBLIC_IP:51820"
      - JOIN_TOKEN=${JOIN_TOKEN}            # секрет для join
      - NODE_API_PORT=8000
      - PEERS_FILE=/data/peers.json
      - EDGE_WG_IP=${EDGE_WG_IP}
      - EDGE_AGENT_PORT=${EDGE_AGENT_PORT}

    volumes:
      - wg_controller_data:/data
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    ports:
      - "9000:9000"        # controller api (join/proxy)
      - "51820:51820/udp"  # wireguard
    restart: unless-stopped

volumes:
  wg_controller_data:
